function renderAttractCharacters() {
  drawNamcoCenter('CAST OF CHARACTERS', 50, COLOR.TEXT_TITLE, 2);

  const startY = 100;
  const spacing = 55;
  const indentStep = 20; // each character indented further right
  const baseX = 80; // starting sprite X (moved 50px right)
  const textOffsetX = 40; // text offset from sprite

  // Hold on title for 2 seconds (120 frames) before revealing characters
  const revealDelay = 120;
  const revealFrame = 60; // one character per second
  const elapsed = game.attractTimer - revealDelay;
  const numRevealed = elapsed <= 0 ? 0 : Math.min(7, Math.floor(elapsed / revealFrame) + 1);

  const characters = [
    { name: 'Q*THULHU', sprite: SPRITES.qthulhu },
    { name: 'DEEP ONE', sprite: SPRITES.deepone },
    { name: 'MI-GO', sprite: SPRITES.migo },
    { name: 'BABY SHOGGOTH', sprite: SPRITES.shoggoth },
    { name: 'STAR SPAWN', sprite: SPRITES.starspawn },
    { name: 'NIGHT GAUNT', sprite: SPRITES.nightgaunt },
    { name: 'CULTIST', sprite: SPRITES.cultist }
  ];

  for (let i = 0; i < numRevealed; i++) {
    const ch = characters[i];
    const cy = startY + i * spacing;
    const cx = baseX + i * indentStep;

    // Draw sprite
    if (ch.sprite.front.complete && ch.sprite.front.naturalWidth > 0) {
      ctx.drawImage(ch.sprite.front, cx - ch.sprite.w / 2, cy - ch.sprite.h / 2, ch.sprite.w, ch.sprite.h);
    }

    // Draw name (white)
    drawNamco(ch.name, cx + textOffsetX, cy - 8, '#fff', 2);
  }

  // Flying Night Gaunt carrying Q*thulhu — after all characters revealed
  const charRevealEnd = revealDelay + 7 * revealFrame + 60; // all revealed + 1 sec pause
  const flyStart = (game.attractTimer + (game.interpFactor || 0)) - charRevealEnd;
  if (flyStart > 0 && nightGauntCarryImg.complete && nightGauntCarryImg.naturalWidth > 0) {
    const flyDuration = 300; // frames per pass (slower)
    const imgW = 96;
    const imgH = 72;
    const flyY = 510; // vertical center between characters and "click" text

    let flyX, flyYOffset, flipX;
    if (flyStart <= flyDuration) {
      // First pass: left to right
      const progress = flyStart / flyDuration;
      flyX = -imgW + (CANVAS_W + imgW * 2) * progress;
      flyYOffset = Math.sin(progress * Math.PI * 3) * 8; // gentle bobbing
      flipX = false;
    } else if (flyStart <= flyDuration + 60) {
      // Gap between passes — off screen
      flyX = -999;
      flyYOffset = 0;
      flipX = false;
    } else {
      // Second pass: right to left
      const pass2Start = flyStart - flyDuration - 60;
      const progress = pass2Start / flyDuration;
      flyX = CANVAS_W + imgW - (CANVAS_W + imgW * 2) * progress;
      flyYOffset = Math.sin(progress * Math.PI * 3) * 8;
      flipX = true;
    }

    if (flyX > -imgW && flyX < CANVAS_W + imgW) {
      ctx.save();
      ctx.translate(flyX, flyY + flyYOffset);
      if (flipX) ctx.scale(-1, 1);
      ctx.drawImage(nightGauntCarryImg, -imgW / 2, -imgH / 2, imgW, imgH);
      ctx.restore();
    }
  }
}

// ------------------------------------------------------------
// SECTION 22: MAIN RENDER
// ------------------------------------------------------------

function render() {
  if (game.state === STATE.ATTRACT) {
    renderAttractMode();
    return;
  }

  if (game.state === STATE.GAME_OVER) {
    renderGameOver();
    return;
  }

  if (game.state === STATE.LEVEL_INTRO) {
    renderBackground();
    drawNamcoCenter('LEVEL ' + game.level, CANVAS_H / 2 - 40, COLOR.TEXT_HIGHLIGHT, 4);
    if (game.level >= 3) {
      drawNamcoCenter('THE ALERT OPENS FIRE', CANVAS_H / 2 + 20, '#aa8833', 2);
    } else if (game.level >= 2) {
      drawNamcoCenter('MI-GO APPEAR', CANVAS_H / 2 + 20, '#6a3a8a', 2);
    }
    drawNamcoCenter('GET READY', CANVAS_H / 2 + 60, '#ccc', 2);
    return;
  }

  // Playing / Level Clear / Dying / Falling states
  renderBackground();
  renderCthulhuHead();
  renderAmbientTentacles();

  // If player is falling AWAY from camera (up-left or up-right), render them behind the pyramid
  const fallingBehind = game.player.falling &&
    (game.player.fallDir === 'UP_LEFT' || game.player.fallDir === 'UP_RIGHT');
  if (fallingBehind) {
    renderPlayer();
  }

  // Render board
  for (let r = 0; r < PYRAMID_ROWS; r++) {
    for (let c = 0; c <= r; c++) {
      renderCube(r, c);
      renderTentacleEruption(r, c);
    }
  }

  // Soft fade at the bottom edge of the pyramid blocks (removed)

  // Render Night Gaunts
  renderNightGaunts();

  // Render Elder Signs
  renderElderSigns();

  // Render ship (in the water below pyramid)
  renderShip();

  // Render enemies
  for (const e of game.enemies) {
    renderEnemy(e);
  }

  // Render player in front of pyramid (normal play, or falling toward camera)
  if (!fallingBehind) {
    renderPlayer();
  }

  // Render particles
  renderParticles();

  // Render HUD
  renderHUD();

  // Level clear overlay
  if (game.state === STATE.LEVEL_CLEAR) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    drawNamcoCenter('LEVEL CLEAR!', CANVAS_H / 2 - 20, COLOR.TEXT_HIGHLIGHT, 3);
    drawNamcoCenter('BONUS: ' + SCORE.LEVEL_CLEAR, CANVAS_H / 2 + 20, '#fff', 2);
  }
}

let audioReady = false;
let audioCtx = null;
const audioBuffers = {};
let bgMusicSource = null;
let bgMusicBuffer = null;
let shipEngineSource = null;
let shipEngineBuffer = null;
let activeFreezeCountdownSource = null;

// Master volumes
const SFX_VOLUME = 0.35;
const BG_MUSIC_VOLUME = 0.7;
const SHIP_ENGINE_VOLUME = 0.12;

// Sound file paths
const SFX_PATHS = {
  hop:            'assets/sfx/q-land.mp3',
  convert:        'assets/sfx/cube-convert.mp3',
  tentacleWarn:   'assets/sfx/tentacle-warn.mp3',
  death:          'assets/sfx/player-death.mp3',
  levelClear:     'assets/sfx/level-clear.mp3',
  gameOver:       'assets/sfx/game-over.mp3',
  collectible:    'assets/sfx/collectible-grab.mp3',
  freezeCountdown:'assets/sfx/freeze-countdown.mp3',
  splash:         'assets/sfx/splash.mp3',
  cannonFire:     'assets/sfx/cannon-fire.mp3',
  nightGauntGrab: 'assets/sfx/night-gaunt-grab.mp3',
  nightGauntRise: 'assets/sfx/night-gaunt-rise.mp3',
  enemyDestroy:   'assets/sfx/enemy-destroy.mp3',
  extraLife:      'assets/sfx/extra-life.mp3',
  deeponeSpawn:   'assets/sfx/deep-one-spawn.mp3',
  migoSpawn:      'assets/sfx/mi-go-spawn.mp3',
  shoggothSpawn:  'assets/sfx/shoggoth-spawn.mp3',
  starspawnSpawn: 'assets/sfx/star-spawn-spawn.mp3',
  cultistSpawn:   'assets/sfx/cultist-spawn.mp3',
  deeponeLand:    'assets/sfx/deep-one-land.mp3',
  migoLand:       'assets/sfx/mi-go-land.mp3',
  shoggothLand:   'assets/sfx/shoggoth-land.mp3',
  starspawnLand:  'assets/sfx/star-spawn-land.mp3',
  cultistLand:    'assets/sfx/cultist-land.mp3'
};

async function loadAudioBuffer(url) {
  try {
    const response = await fetch(url);
    const arrayBuffer = await response.arrayBuffer();
    return await audioCtx.decodeAudioData(arrayBuffer);
  } catch (e) {
    return null;
  }
}

async function initAudio() {
  if (audioReady) return;
  audioReady = true;

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // Resume context (required for iOS)
  if (audioCtx.state === 'suspended') {
    await audioCtx.resume();
  }

  // Load all SFX buffers
  const loadPromises = Object.entries(SFX_PATHS).map(async ([key, path]) => {
    audioBuffers[key] = await loadAudioBuffer(path);
  });

  // Load bg music and ship engine
  const bgPromise = loadAudioBuffer('assets/sfx/bg-music.mp3').then(buf => { bgMusicBuffer = buf; });
  const shipPromise = loadAudioBuffer('assets/sfx/ship-engine.mp3').then(buf => { shipEngineBuffer = buf; });

  await Promise.all([...loadPromises, bgPromise, shipPromise]);

  // Start background music
  startBgMusic();
}

function playSfx(key, volume) {
  if (!audioReady || !audioCtx || !audioBuffers[key]) return null;
  const source = audioCtx.createBufferSource();
  source.buffer = audioBuffers[key];
  const gainNode = audioCtx.createGain();
  gainNode.gain.value = volume !== undefined ? volume : SFX_VOLUME;
  source.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  source.start(0);
  return source;
}

function startBgMusic() {
  if (!audioCtx || !bgMusicBuffer) return;
  stopBgMusic();
  bgMusicSource = audioCtx.createBufferSource();
  bgMusicSource.buffer = bgMusicBuffer;
  bgMusicSource.loop = true;
  const gainNode = audioCtx.createGain();
  gainNode.gain.value = BG_MUSIC_VOLUME;
  bgMusicSource.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  bgMusicSource.start(0);
}

function stopBgMusic() {
  if (bgMusicSource) {
    try { bgMusicSource.stop(); } catch (e) {}
    bgMusicSource = null;
  }
}

function startShipEngine() {
  if (!audioCtx || !shipEngineBuffer) return;
  stopShipEngine();
  shipEngineSource = audioCtx.createBufferSource();
  shipEngineSource.buffer = shipEngineBuffer;
  shipEngineSource.loop = true;
  const gainNode = audioCtx.createGain();
  gainNode.gain.value = SHIP_ENGINE_VOLUME;
  shipEngineSource.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  shipEngineSource.start(0);
}

function stopShipEngine() {
  if (shipEngineSource) {
    try { shipEngineSource.stop(); } catch (e) {}
    shipEngineSource = null;
  }
}

function playHop() { playSfx('hop', 0.15); }
function playConvert() { playSfx('convert'); }
function playTentacleWarn() { playSfx('tentacleWarn'); }
function playDeath() { playSfx('death', 0.2); }
function playLevelClear() { playSfx('levelClear'); }
function playGameOver() { playSfx('gameOver'); }
function playCollectible() { playSfx('collectible', 0.6); }
function playFreezeCountdown() { activeFreezeCountdownSource = playSfx('freezeCountdown'); }
function stopFreezeCountdown() { if (activeFreezeCountdownSource) { try { activeFreezeCountdownSource.stop(); } catch(e) {} activeFreezeCountdownSource = null; } }

function playExplosion() { playSfx('cannonFire', 0.5); }

function playNightGauntRise() { playSfx('nightGauntRise'); }
function playEnemyDestroy() { playSfx('enemyDestroy'); }
function playExtraLife() { playSfx('extraLife', 0.5); }

function playEnemySpawn(type) {
  const map = { deepone: 'deeponeSpawn', migo: 'migoSpawn', shoggoth: 'shoggothSpawn', starspawn: 'starspawnSpawn', cultist: 'cultistSpawn' };
  if (map[type]) playSfx(map[type]);
}

function playEnemyLand(type) {
  const map = { deepone: 'deeponeLand', migo: 'migoLand', shoggoth: 'shoggothLand', starspawn: 'starspawnLand', cultist: 'cultistLand' };
  if (map[type]) playSfx(map[type]);
}

// ------------------------------------------------------------
// SECTION 24: GAME LOOP
// ------------------------------------------------------------

let lastTime = 0;
const TARGET_FPS = 60;
const FRAME_TIME = 1000 / TARGET_FPS;
let accumulator = 0;

function gameLoop(timestamp) {
  const delta = timestamp - lastTime;
  lastTime = timestamp;
  accumulator += delta;

  // Fixed timestep updates
  while (accumulator >= FRAME_TIME) {
    update();
    accumulator -= FRAME_TIME;
  }

  // Sub-frame interpolation factor (0 to 1 between ticks)
  game.interpFactor = accumulator / FRAME_TIME;

  render();
  requestAnimationFrame(gameLoop);
}

// ------------------------------------------------------------
// SECTION 25: QR CODE GENERATION
// ------------------------------------------------------------

function generateQR() {
  try {
    if (typeof qrcode !== 'undefined') {
      const qr = qrcode(0, 'M');
      qr.addData('https://www.paypal.com/donate/?hosted_button_id=HDD77QKGC6XXN');
      qr.make();
      const qrEl = document.getElementById('qr-code');
      if (qrEl) {
        qrEl.innerHTML = qr.createImgTag(2, 0);
      }
    }
  } catch (e) {
    // QR generation failed silently
  }
}

// ------------------------------------------------------------
// SECTION 26: BOOTSTRAP
// ------------------------------------------------------------

document.addEventListener('DOMContentLoaded', () => {
  generateQR();
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
});

// Initialize audio on first user interaction
document.addEventListener('click', initAudio, { once: true });
document.addEventListener('keydown', initAudio, { once: true });
document.addEventListener('touchstart', initAudio, { once: true });

</script>
